version: '3.8'

services:

  mysql:
    image: mysql:8.0
    container_name: clinique_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: clinique_medicale
      MYSQL_USER: clinique_user
      MYSQL_PASSWORD: clinique_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - clinique_network

  backend:
    build: ./backend
    container_name: clinique_backend
    restart: always
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/clinique_medicale?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: clinique_user
      SPRING_DATASOURCE_PASSWORD: clinique_pass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    networks:
      - clinique_network

  frontend:
    build: ./frontend/frontend
    container_name: clinique_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - clinique_network

volumes:
  mysql_data:

networks:
  clinique_network:
    driver: bridge