<div class="page-header">
  <div>
    <h1 class="page-title">{{ isEdit() ? 'Modifier le patient' : 'Nouveau patient' }}</h1>
    <p class="page-subtitle">{{ isEdit() ? 'Mettre à jour le dossier patient' : 'Ajouter un nouveau patient au système'
      }}</p>
  </div>
  <a routerLink="/patients" class="btn btn-outline">← Retour</a>
</div>

@if (error()) {
<div class="alert-error">{{ error() }}</div>
}

@if (loading()) {
<div class="loading-state">
  <div class="spinner"></div><span>Chargement…</span>
</div>
} @else {
<div class="card form-card">
  <div class="form-section">
    <h3 class="section-title">Informations personnelles</h3>
    <div class="form-grid">
      <div class="form-group">
        <label>Nom <span class="required">*</span></label>
        <input type="text" placeholder="ex: Ben Ali" [value]="form().nom"
          (input)="updateField('nom', $any($event.target).value)" />
      </div>
      <div class="form-group">
        <label>Date de naissance <span class="required">*</span></label>
        <input type="date" [value]="form().dateDeNaissance"
          (input)="updateField('dateDeNaissance', $any($event.target).value)" />
      </div>
      <div class="form-group">
        <label>Téléphone <span class="required">*</span></label>
        <input type="tel" placeholder="ex: +216 XX XXX XXX" [value]="form().numTel"
          (input)="updateField('numTel', $any($event.target).value)" />
      </div>

    </div>
  </div>

  <div class="form-footer">
    <a routerLink="/patients" class="btn btn-outline">Annuler</a>
    <button class="btn btn-primary" (click)="submit()" [disabled]="saving()">
      @if (saving()) { <div class="spinner-sm"></div> }
      {{ saving() ? 'Sauvegarde…' : (isEdit() ? 'Mettre à jour' : 'Créer le patient') }}
    </button>
  </div>
</div>
}
