<div class="page-header">
    <h1 class="page-title">{{ isEdit() ? 'Modifier médecin' : 'Nouveau médecin' }}</h1>
    <a routerLink="/medecins" class="btn btn-outline">← Retour</a>
</div>

<div class="card" *ngIf="!loading(); else loadingTpl">
    <form (ngSubmit)="submit()">
        <div class="form-group">
            <label>Nom complet</label>
            <input type="text" [value]="form().nom" (input)="updateField('nom', $event.target.value)"
                placeholder="Ex: Dr. Dupont" required>
        </div>

        <div class="form-group">
            <label>Spécialité</label>
            <input type="text" [value]="form().specialite" (input)="updateField('specialite', $event.target.value)"
                placeholder="Ex: Cardiologie" required>
        </div>

        <div class="form-group">
            <label>Disponibilité</label>
            <label class="checkbox-label">
                <input type="checkbox" [checked]="form().disponibilite"
                    (change)="updateField('disponibilite', $event.target.checked ? 'true' : 'false')">
                Disponible
            </label>
        </div>

        <div class="form-actions">
            <span *ngIf="error()" class="error">{{ error() }}</span>
            <button type="submit" [disabled]="saving()" class="btn btn-primary">
                {{ saving() ? 'Sauvegarde...' : (isEdit() ? 'Mettre à jour' : 'Créer') }}
            </button>
        </div>
    </form>
</div>

<ng-template #loadingTpl>
    <div style="padding:1rem; text-align:center">Chargement...</div>
</ng-template>
