<div class="app-sidebar-wrapper">
    <div class="logo">
        <svg class="logo-icon" alt="logo-icon" viewBox="0 0 24 24">
            <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="currentColor" stroke="currentColor" stroke-width="2" />
            <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" />
            <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" />
        </svg>
        <span class="logo-text">Clinic</span>
    </div>
    <nav class="app-sidebar-nav">
        <ul class="menu-list">
            <li class="nav-item" *ngFor="let item of menuItems">
                <a class="nav-link" [routerLink]="[item.path]" [routerLinkActive]="'active'">
                    <span class="nav-icon">{{ item.icon }}</span>
                    <span class="nav-text">{{ item.label }}</span>
                </a>
            </li>
        </ul>
    </nav>
</div>
